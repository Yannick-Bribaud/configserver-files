server:
  port: 9010

spring:
  application:
    name: "server-eureka"
  profiles:
    active: "dev"
  config:
    import: "optional:configserver:http://localhost:8888/"

eureka:
  instance:
    hostname: localhost
  client:
    fetchRegistry: false
    registerWithEureka: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/


logging:
  pattern:
    console: "%green(%d{yyyy-MM-dd' 'HH:mm:ss.SSSXXX}) %blue(%-5level) %red([%thread]) %cyan(%logger{25}) - %msg%n"
